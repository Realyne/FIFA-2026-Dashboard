# World Cup 2026 dashboard — installed to /etc/nginx/sites-available/wc2026
# DOMAIN, WEB_ROOT, and API_PORT are substituted by deploy.sh

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __WEB_ROOT__;
    index index.html;

    # SPA (hash routing — all paths fall back to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Live data API (FastAPI in Docker)
    location /api/wc/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE stream — disable buffering, long read timeout
    location /api/wc/stream {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
